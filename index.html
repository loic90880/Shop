<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma Boutique</title>
<meta name="description" content="Catalogue de produits. Commande par WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#" id="brand">Ma Boutique</a>
  <input id="search" type="search" placeholder="Rechercher un produit" aria-label="Rechercher un produit">
  <button id="open-cart" class="cart-btn" aria-label="Ouvrir le panier">Panier <span id="count">0</span></button>
</header>

<section class="hero">
  <h1 id="tagline">Des produits choisis un par un.</h1>
  <p id="intro">Ajoutez au panier, puis envoyez votre commande par WhatsApp. Pas de compte à créer.</p>
</section>

<nav id="filters" class="filters" aria-label="Catégories"></nav>
<main id="grid" class="grid"></main>
<p id="empty" class="empty" hidden>Aucun produit ne correspond. Essayez un autre mot ou une autre catégorie.</p>

<aside id="drawer" class="drawer" aria-hidden="true" aria-label="Panier">
  <div class="drawer-head"><h2>Votre panier</h2><button id="close-cart" aria-label="Fermer le panier">Fermer</button></div>
  <ul id="lines" class="lines"></ul>
  <p id="cart-empty" class="empty">Votre panier est vide.</p>
  <div class="drawer-foot">
    <div class="total"><span>Total</span><strong id="total">0</strong></div>
    <button id="order" class="primary">Commander sur WhatsApp</button>
  </div>
</aside>
<div id="scrim" class="scrim" hidden></div>

<footer class="foot"><span id="foot-text">© Ma Boutique</span></footer>
<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/app.js"></script>
</body>
</html>
